<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carpool to School</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --ink: #18303F;        /* deep harbour blue: text, outlines */
            --ink-soft: #4E6472;   /* secondary text */
            --paper: #EEF2F0;      /* cool grey-green page */
            --card: #FFFFFF;
            --line: #C9D3CF;       /* field borders */
            --signal: #FFC21A;     /* school-bus yellow: the one loud colour */
            --go: #1F7A55;         /* success */
            --stop: #B3261E;       /* errors */
            --radius-field: 10px;
            --radius-panel: 22px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--paper);
            color: var(--ink);
            font-family: "Archivo", system-ui, sans-serif;
            font-variation-settings: "wdth" 100;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: grid;
            grid-template-columns: minmax(360px, 440px) 1fr;
            height: 100vh;
        }

        /* ---------- Panel ---------- */
        .panel {
            display: flex;
            flex-direction: column;
            padding: 40px 40px 28px;
            overflow-y: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 56px;
        }
        .brand-mark {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--signal);
            border: 3px solid var(--ink);
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.6rem, 4.2vw, 3.4rem);
            line-height: 0.95;
            font-weight: 800;
            font-variation-settings: "wdth" 125;
            letter-spacing: -0.01em;
        }

        .lede {
            margin: 0 0 36px;
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--ink-soft);
            max-width: 34ch;
        }

        form { display: grid; gap: 20px; }

        .field { display: grid; gap: 7px; }

        label, .label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 14px;
            font: inherit;
            font-size: 1rem;
            color: var(--ink);
            background: var(--card);
            border: 1.5px solid var(--line);
            border-radius: var(--radius-field);
            transition: border-color .15s;
        }
        input[type="text"]::placeholder { color: #8A9A9F; }
        input[type="text"]:hover { border-color: var(--ink-soft); }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--ink);
            box-shadow: 0 0 0 3px var(--signal);
        }
        input[aria-invalid="true"] { border-color: var(--stop); }

        .pickup {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--card);
            border: 1.5px dashed var(--line);
            border-radius: var(--radius-field);
            font-size: 0.95rem;
            color: var(--ink-soft);
        }
        .pickup.is-set {
            border-style: solid;
            border-color: var(--ink);
            color: var(--ink);
        }
        .pickup-dot {
            flex: none;
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid currentColor;
        }
        .pickup.is-set .pickup-dot { background: var(--signal); border-color: var(--ink); }
        .pickup-text { flex: 1; line-height: 1.35; }

        .link-btn {
            flex: none;
            padding: 4px 2px;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--ink);
            background: none;
            border: none;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .submit {
            margin-top: 6px;
            padding: 16px 20px;
            font: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--ink);
            background: var(--signal);
            border: 2px solid var(--ink);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--ink);
            transition: transform .08s, box-shadow .08s;
        }
        .submit:hover { background: #FFCD45; }
        .submit:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
        .submit:disabled { opacity: .6; cursor: progress; }

        button:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        .status {
            min-height: 1.4em;
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .status.ok { color: var(--go); font-weight: 600; }
        .status.err { color: var(--stop); font-weight: 600; }

        .foot {
            margin-top: auto;
            padding-top: 32px;
            font-size: 0.8rem;
            color: var(--ink-soft);
        }

        /* ---------- Map ---------- */
        .map-wrap {
            position: relative;
            padding: 14px 14px 14px 0;
        }
        #map {
            width: 100%;
            height: 100%;
            border-radius: var(--radius-panel);
            border: 2px solid var(--ink);
            cursor: crosshair;
        }

        .map-hint {
            position: absolute;
            left: 50%;
            top: 32px;
            transform: translateX(-50%);
            z-index: 500;
            padding: 9px 16px;
            background: var(--ink);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 999px;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity .25s;
        }
        .map-hint.hidden { opacity: 0; }

        /* Pickup pin */
        .pin {
            width: 26px; height: 26px;
            border-radius: 50%;
            background: var(--signal);
            border: 4px solid var(--ink);
            box-shadow: 0 0 0 4px rgba(255, 194, 26, .35);
        }
        .pin.drop { animation: drop .35s cubic-bezier(.3,1.6,.6,1); }
        @keyframes drop {
            from { transform: translateY(-18px) scale(.6); opacity: 0; }
            to   { transform: none; opacity: 1; }
        }

        /* Leaflet controls, restyled to match */
        .leaflet-bar {
            border: 2px solid var(--ink) !important;
            border-radius: 12px !important;
            overflow: hidden;
            box-shadow: none !important;
        }
        .leaflet-bar a {
            width: 36px !important; height: 36px !important; line-height: 34px !important;
            color: var(--ink) !important;
            font-family: "Archivo", sans-serif;
        }
        .leaflet-container { font-family: "Archivo", system-ui, sans-serif; }
        .leaflet-control-attribution { border-radius: 8px 0 0 0; }

        /* ---------- Small screens ---------- */
        @media (max-width: 820px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: 46vh auto;
                height: auto;
            }
            .map-wrap { order: -1; padding: 12px 12px 0; height: 46vh; }
            .map-hint { top: 26px; }
            .panel { padding: 28px 20px 24px; overflow: visible; }
            .brand { margin-bottom: 28px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<div class="app">
    <section class="panel">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Carpool</div>

        <h1>Share the ride to school</h1>
        <p class="lede">Tell us who you are and where you'll be picked up, so we can match you with families heading the same way.</p>

        <form id="signupForm" novalidate>
            <div class="field">
                <label for="nameInput">Your name</label>
                <input type="text" id="nameInput" autocomplete="name" placeholder="e.g. Camille Tremblay">
            </div>

            <div class="field">
                <label for="schoolInput">School</label>
                <input type="text" id="schoolInput" autocomplete="organization" placeholder="e.g. École Saint-Laurent">
            </div>

            <div class="field">
                <span id="pickupLabel" class="label">Pickup spot</span>
                <div class="pickup" id="pickupBox" aria-labelledby="pickupLabel">
                    <span class="pickup-dot" aria-hidden="true"></span>
                    <span class="pickup-text" id="pickupText">Tap the map to place your pin</span>
                    <button type="button" class="link-btn" id="locateBtn">Use my location</button>
                </div>
            </div>

            <button type="submit" class="submit" id="submitBtn">Join the carpool</button>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>

        <p class="foot">Montreal pilot, built at a hackathon</p>
    </section>

    <div class="map-wrap">
        <div id="map" aria-label="Map. Click to set your pickup spot."></div>
        <div class="map-hint" id="mapHint">Tap where you'd like to be picked up</div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase & Map Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAEIVTEafHPn9G7AAnW04EjYFBq65-bKSI",
        authDomain: "carpool-47bf9.firebaseapp.com",
        projectId: "carpool-47bf9",
        storageBucket: "carpool-47bf9.firebasestorage.app",
        messagingSenderId: "239922567348",
        appId: "1:239922567348:web:b8428e085513fcfe2c9fe1",
        measurementId: "G-70C309H2M2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---- Map (centred on Montreal) ----
    const map = L.map('map', { zoomControl: false }).setView([45.5017, -73.5673], 12);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        referrerPolicy: 'strict-origin-when-cross-origin',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const $ = (id) => document.getElementById(id);
    const pinIcon = L.divIcon({ className: '', html: '<div class="pin drop"></div>', iconSize: [26, 26], iconAnchor: [13, 13] });

    let pickup = null;
    let marker = null;

    function setPickup(lat, lng, source) {
        pickup = { lat, lng };
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng], { icon: pinIcon, keyboard: false }).addTo(map);
        $('pickupBox').classList.add('is-set');
        $('pickupText').textContent = source === 'gps'
            ? 'Pin set at your current location'
            : `Pin set at ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        $('mapHint').classList.add('hidden');
    }

    map.on('click', (e) => setPickup(e.latlng.lat, e.latlng.lng, 'map'));

    $('locateBtn').addEventListener('click', () => {
        if (!navigator.geolocation) {
            showStatus('err', "This browser can't share your location. Tap the map instead.");
            return;
        }
        $('pickupText').textContent = 'Finding you…';
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const { latitude, longitude } = pos.coords;
                setPickup(latitude, longitude, 'gps');
                map.setView([latitude, longitude], 15);
            },
            () => {
                $('pickupText').textContent = 'Tap the map to place your pin';
                showStatus('err', 'Location access was blocked. Tap the map to set your pickup spot.');
            }
        );
    });

    // ---- Form ----
    function showStatus(kind, msg) {
        const el = $('status');
        el.className = 'status ' + kind;
        el.textContent = msg;
    }

    $('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nameEl = $('nameInput');
        const schoolEl = $('schoolInput');
        const name = nameEl.value.trim();
        const school = schoolEl.value.trim();

        nameEl.setAttribute('aria-invalid', !name);
        schoolEl.setAttribute('aria-invalid', !school);

        if (!name || !school) {
            showStatus('err', 'Add your name and school to join.');
            (!name ? nameEl : schoolEl).focus();
            return;
        }

        const btn = $('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Joining…';
        showStatus('', '');

        try {
            const docRef = await addDoc(collection(db, "users"), {
                name,
                school,
                lat: pickup ? pickup.lat : 45.5017,  // falls back to Montreal centre
                lng: pickup ? pickup.lng : -73.5673,
                createdAt: Date.now()
            });
            console.log("Document written with ID: ", docRef.id);
            showStatus('ok', `You're in, ${name}. We'll look for rides to ${school}.`);
            e.target.reset();
        } catch (err) {
            console.error("Error adding document: ", err);
            showStatus('err', "Couldn't save your sign-up. Check your connection and try again.");
        } finally {
            btn.disabled = false;
            btn.textContent = 'Join the carpool';
        }
    });
</script>
</body>
</html>
